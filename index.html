<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruce JS Designer</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            background: #1a0033;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            max-width: 960px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 12px;
        }

        canvas {
            display: block;
            margin: 0 auto 12px;
            background: #000;
            border-radius: 6px;
            image-rendering: pixelated;
            touch-action: none;
        }

        .main-settings, .properties {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .settings-container {
            display: flex;
            gap: 24px;
            margin-bottom: 12px;
            align-items: flex-start;
        }

        .main-settings {
            flex: 1;
            min-width: 0;
        }

        .properties {
            flex: 1;
            min-width: 0;
        }

        .main-settings, .properties {
            margin-top: 20px;
        }

        .main-settings label, .properties label {
            flex: 1 1 45%;
            display: flex;
            flex-direction: column;
        }

        .main-settings .full-width, .properties .full-width {
            flex: 1 1 100%;
        }

        .main-settings h2, .properties h2 {
            margin: 0 0 0 0;
            font-size: 1.2em;
            width: 100%;
        }

        input, select {
            width: 100%;
            padding: 6px;
            border-radius: 8px;
            border: none;
            background: #4b2e83;
            color: #fff;
            box-sizing: border-box;
        }

        input[type="color"] {
            padding: 0;
            height: 32px;
        }

        input[type="range"] {
            padding: 0;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .buttons button {
            flex: 1 1 0;
            min-width: 100px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #6c43b2;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .buttons button:hover {
            background: #8457d6;
        }

        .buttons .danger {
            background: #ff4d6d;
        }

        .buttons .export {
            background: #4dff88;
            color: #000;
        }

        .buttons .duplicate {
            background: #FFD700;
            color: #000;
        }

        .buttons .duplicate:hover {
            background: #FFEC70;
        }

        .layer-buttons {
            display: flex;
            gap: 12px;
        }

        .layer-buttons button {
            flex: 1 1 100px;
            background: #6c43b2;;
            color: #fff;
            font-weight: bold;
            border-radius: 10px;
            padding: 8px;
            cursor: pointer;
            border: none; 
        }

        .layer-buttons button:hover {
            background: #6c43b2;;
        }

        .credit-btn {
            display: inline-block;
            text-decoration: none;
            background: #4dff88;
            color: #000;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 10px;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .credit-btn:hover {
            background: #67ff9c;
        }

        code {
            display: block;
            background: #2b0055;
            border: 1px solid #4b2e83;
            padding: 12px;
            border-radius: 8px;
            white-space: pre-wrap;
            margin-top: 12px;
            max-height: 300px;
            overflow: auto;
        }

        .toggle {
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #6c43b2;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        .toggle.on {
            background: #4dff88;
            color: #000;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Bruce JS Designer</h1>

    <canvas id="screen"></canvas>

    <div class="buttons">
        <button onclick="addItem('fillRect')">FillRect</button>
        <button onclick="addItem('rect')">Rect</button>
        <button onclick="addItem('line')">Line</button>
        <button onclick="addItem('circle')">Circle</button>
        <button onclick="addItem('fillCircle')">FillCircle</button>
        <button onclick="addItem('text')">Text</button>
        <button class="duplicate" onclick="duplicateItem()">Duplicate</button>
        <button class="danger" onclick="deleteItem()">Delete</button>
    </div>

    <div class="settings-container">
        <div class="main-settings">
            <h2>Main Settings</h2>

            <label class="full-width">Device
                <select id="device"></select>
            </label>

            <label class="full-width">File name
                <input type="text" id="fileName" value="app">
            </label>

            <label class="full-width">Background Color
                <input type="color" id="backgroundColor" value="#000000">
            </label>

            <label>Snap to Grid
                <button id="snapToggle" class="toggle">OFF</button>
            </label>

            <label>Grid Size
                <input type="number" id="gridSize" min="1" max="50" step="1" value="10">
            </label>

            <label>Always Show Grid
                <button id="alwaysShowGrid" class="toggle">OFF</button>
            </label>

        </div>

        <div class="properties">
            <h2>Layers</h2>

            <label class="full-width">Layer
                <select id="shapeSelect"></select>
            </label>

            <div class="layer-buttons full-width">
                <button id="layerDown">Move Backward</button>
                <button id="layerUp">Move Forward</button>
            </div>

            <h2>Properties</h2>

            <div id="noSelectionMessage" style="text-align: center; color: #999;">
                Select something to view properties
            </div>

            <label id="colorControl" class="full-width" style="display: none;">Color
                <input type="color" id="color">
            </label>

            <label id="textControl" style="display: none;">Text
                <input type="text" id="text">
            </label>

            <label id="textSizeControl" style="display: none;">Text Size
                <input type="range" id="textSize" min="1" max="8" step="1" value="2">
            </label>

            <!-- Dynamic shape controls -->
            <label id="posXControl" style="display: none;">X Position
                <input type="number" id="posX" step="1">
            </label>

            <label id="posYControl" style="display: none;">Y Position
                <input type="number" id="posY" step="1">
            </label>

            <label id="widthControl" style="display: none;">Width
                <input type="number" id="width" min="1" step="1">
            </label>

            <label id="heightControl" style="display: none;">Height
                <input type="number" id="height" min="1" step="1">
            </label>

            <label id="radiusControl" style="display: none;">Radius
                <input type="number" id="radius" min="1" step="1">
            </label>

            <label id="x2Control" style="display: none;">End X
                <input type="number" id="x2" step="1">
            </label>

            <label id="y2Control" style="display: none;">End Y
                <input type="number" id="y2" step="1">
            </label>

        </div>
    </div>
    <div class="buttons">
        <button class="danger" onclick="clearAll()">Clear All</button>
        <button class="export" onclick="exportJS()">Export JS</button>
    </div>

    <code id="code"></code>

    <div class="credits" style="position:fixed; bottom:8px; left:50%; transform:translateX(-50%); font-size:0.8rem; z-index:1000;">
        <a href="https://discord.com/users/sloth110000" target="_blank"
           style="text-decoration:none; background:#4dff88; color:#000; padding:6px 12px; border-radius:8px; font-weight:bold;">
            Made by SLOTH
        </a>
    </div>
</div>

<script>
const canvas = document.getElementById("screen"),
      ctx = canvas.getContext("2d"),
      deviceSelect = document.getElementById("device"),
      shapeSelect = document.getElementById("shapeSelect"),
      textInput = document.getElementById("text"),
      textSizeInput = document.getElementById("textSize"),
      colorInput = document.getElementById("color"),
      backgroundColorInput = document.getElementById("backgroundColor"),
      code = document.getElementById("code"),
      snapToggle = document.getElementById("snapToggle"),
      gridSizeInput = document.getElementById("gridSize"),
      alwaysShowGridInput = document.getElementById("alwaysShowGrid"),
      layerUpBtn = document.getElementById("layerUp"),
      layerDownBtn = document.getElementById("layerDown"),
      // Dynamic shape controls
      posXInput = document.getElementById("posX"),
      posYInput = document.getElementById("posY"),
      widthInput = document.getElementById("width"),
      heightInput = document.getElementById("height"),
      radiusInput = document.getElementById("radius"),
      x2Input = document.getElementById("x2"),
      y2Input = document.getElementById("y2");

let items = [],
    selected = null,
    currentDevice,
    gridSize = 10,
    snapOn = false,
    altHeld = false,
    dragging = null,
    resizing = false,
    resizeHandle = null,
    offsetX = 0,
    offsetY = 0,
    showGrid = false;

const devices = {
    "M5Stack Cardputer/Adv/ StickC-Plus 1.1/StickC-Plus 2": [240, 135],
    "M5Stack Core/Core2/CoreS3/SE": [320, 240],
    "CYD-2432S028": [320, 240],
    "CYD-3248S035": [480, 320],
    "Lilygo T-Embed /CC1101/plus": [320, 170],
    "Lilygo T-LoRa Pager": [480, 222],
    "Lilygo T-Display-S3": [320, 170],
    "Lilygo T-Deck (and Pro)": [320, 240],
    "Lilygo T-Watch-S3": [240, 240]
};

function populateDeviceDropdown() {
    deviceSelect.innerHTML = "";
    
    // Group devices by size
    const devicesBySize = {};
    for (let deviceName in devices) {
        const size = devices[deviceName];
        const sizeKey = `${size[0]} × ${size[1]}`;
        if (!devicesBySize[sizeKey]) {
            devicesBySize[sizeKey] = [];
        }
        devicesBySize[sizeKey].push(deviceName);
    }
    
    // Sort sizes by total pixels (width * height) for logical ordering
    const sortedSizes = Object.keys(devicesBySize).sort((a, b) => {
        const sizeA = a.split(' × ').map(Number);
        const sizeB = b.split(' × ').map(Number);
        return (sizeA[0] * sizeA[1]) - (sizeB[0] * sizeB[1]);
    });
    
    // Create optgroups for each size
    for (let sizeKey of sortedSizes) {
        let optgroup = document.createElement("optgroup");
        optgroup.label = sizeKey;
        
        // Sort devices within each group alphabetically
        devicesBySize[sizeKey].sort().forEach(deviceName => {
            let option = document.createElement("option");
            option.value = deviceName;
            option.textContent = deviceName;
            optgroup.appendChild(option);
        });
        
        deviceSelect.appendChild(optgroup);
    }

    if (!currentDevice) {
        currentDevice = deviceSelect.value;
    }
}


function updateCanvasSize() {
    const size = devices[currentDevice];
    canvas.width = size[0];
    canvas.height = size[1];
    render();
}


snapToggle.addEventListener("click", () => {
    snapOn = !snapOn;
    snapToggle.textContent = snapOn ? "ON" : "OFF";
    snapToggle.classList.toggle("on", snapOn);
});

gridSizeInput.addEventListener("input", () => {
    gridSize = parseInt(gridSizeInput.value) || 10;
    render();
});

alwaysShowGridInput.addEventListener("click", () => {
    showGrid = !showGrid;
    alwaysShowGridInput.textContent = showGrid ? "ON" : "OFF";
    alwaysShowGridInput.classList.toggle("on", showGrid);
    render();
});

backgroundColorInput.addEventListener("input", () => {
    render();
});

function getRandomColor() {
    let c = "#";
    for (let i = 0; i < 6; i++) {
        c += "0123456789ABCDEF"[Math.floor(Math.random() * 16)];
    }
    return c;
}

function clamp(v, min, max) {
    return Math.min(Math.max(v, min), max);
}


function addItem(t) {
    const o = { type: t, x: 40, y: 40, w: 40, h: 40, size: 2, color: getRandomColor(), text: "Text" };
    if (t.includes("circle") || t.includes("fillCircle")) o.w = o.h = 20;
    if (t === "line") {
        // For lines, use x,y as start point and x2,y2 as end point
        o.x2 = o.x + o.w;
        o.y2 = o.y + o.h;
    }
    if (snapOn !== altHeld) {
        o.x = Math.round(o.x / gridSize) * gridSize;
        o.y = Math.round(o.y / gridSize) * gridSize;
        if (o.x2 !== undefined) {
            o.x2 = Math.round(o.x2 / gridSize) * gridSize;
            o.y2 = Math.round(o.y2 / gridSize) * gridSize;
        }
    }
    items.push(o);
    selected = o;
    updateLayerSelect();
    render();
}

function duplicateItem() {
    if (!selected) return;
    const o = { ...selected };
    o.x += 10;
    o.y += 10;
    if (o.type === "line") {
        o.x2 += 10;
        o.y2 += 10;
    }
    if (snapOn !== altHeld) {
        o.x = Math.round(o.x / gridSize) * gridSize;
        o.y = Math.round(o.y / gridSize) * gridSize;
        if (o.x2 !== undefined) {
            o.x2 = Math.round(o.x2 / gridSize) * gridSize;
            o.y2 = Math.round(o.y2 / gridSize) * gridSize;
        }
    }
    items.push(o);
    selected = o;
    updateLayerSelect();
    render();
}

function deleteItem() {
    if (!selected) return;
    items = items.filter(i => i !== selected);
    selected = null;
    updateLayerSelect();
    render();
}

function clearAll() {
    if (items.length === 0) return;
    if (confirm('Are you sure you want to clear all? This cannot be undone.')) {
        items = [];
        selected = null;
        updateLayerSelect();
        render();
    }
}


layerUpBtn.addEventListener("click", () => {
    if (!selected) return;
    const idx = items.indexOf(selected);
    if (idx < items.length - 1) {
        items.splice(idx, 1);
        items.splice(idx + 1, 0, selected);
    }
    updateLayerSelect();
    render();
});

layerDownBtn.addEventListener("click", () => {
    if (!selected) return;
    const idx = items.indexOf(selected);
    if (idx > 0) {
        items.splice(idx, 1);
        items.splice(idx - 1, 0, selected);
    }
    updateLayerSelect();
    render();
});


function render() {
    ctx.fillStyle = backgroundColorInput.value;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    
    if (showGrid) {
        // Calculate inverse of background color for grid lines
        const bgRgb = rgb(backgroundColorInput.value);
        const inverseRgb = bgRgb.map(c => 255 - c);
        const inverseColor = `rgb(${inverseRgb.join(', ')})`;
        ctx.strokeStyle = inverseColor;
        ctx.lineWidth = 0.5;
        for (let x = 0; x <= Math.floor(canvas.width / gridSize) * gridSize; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }
        for (let y = 0; y <= Math.floor(canvas.height / gridSize) * gridSize; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
    }

    
    items.forEach(i => {
        let iw = i.w, ih = i.h;
        if (i.type === "text") {
            iw = ctx.measureText(i.text).width;
            ih = i.size * 8;
        }

        ctx.save();
        ctx.translate(i.x, i.y);
        ctx.strokeStyle = ctx.fillStyle = i.color;
        ctx.lineWidth = 2;

        switch (i.type) {
            case "fillRect":
                ctx.fillRect(0, 0, i.w, i.h);
                break;
            case "rect":
                ctx.strokeRect(0, 0, i.w, i.h);
                break;
            case "line":
                // Draw line using absolute coordinates
                ctx.restore(); // Restore to avoid translation
                ctx.save();
                ctx.strokeStyle = i.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(i.x, i.y);
                ctx.lineTo(i.x2, i.y2);
                ctx.stroke();
                break;
            case "circle":
                ctx.beginPath();
                ctx.arc(i.w / 2, i.h / 2, i.w / 2, 0, 2 * Math.PI);
                ctx.stroke();
                break;
            case "fillCircle":
                ctx.beginPath();
                ctx.arc(i.w / 2, i.h / 2, i.w / 2, 0, 2 * Math.PI);
                ctx.fill();
                break;
            case "text":
                ctx.font = `${i.size * 8}px Arial`;
                ctx.fillText(i.text, 0, ih / 2 + i.size * 4);
                break;
        }

        
        if (i === selected) {
            ctx.strokeStyle = "blue";
            ctx.lineWidth = 1.5;

            if (i.type === "text") {
                const iw = ctx.measureText(i.text).width;
                const ih = i.size * 8;
                ctx.strokeRect(0, 0, iw, ih);
            } else if (i.type === "line") {
                // For lines, show handles at start and end points
                ctx.restore(); // Restore to avoid translation
                ctx.save();
                [{ x: i.x, y: i.y }, { x: i.x2, y: i.y2 }].forEach(h => {
                    ctx.beginPath();
                    ctx.arc(h.x, h.y, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = "blue";
                    ctx.fill();
                });
            } else {
                ctx.strokeRect(0, 0, i.w, i.h);
                [{ x: 0, y: 0 }, { x: i.w, y: 0 }, { x: 0, y: i.h }, { x: i.w, y: i.h }].forEach(h => {
                    ctx.beginPath();
                    ctx.arc(h.x, h.y, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = "blue";
                    ctx.fill();
                });
            }
        }

        ctx.restore();
    });

    syncUI();
    generateCode();
    saveState();
}


canvas.addEventListener("mousedown", startDrag);
canvas.addEventListener("touchstart", startDrag, { passive: false });
document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag, { passive: false });
document.addEventListener("mouseup", stopDrag);
document.addEventListener("touchend", stopDrag);

// Track ALT key for temporary snap disable
document.addEventListener("keydown", (e) => {
    if (e.altKey) {
        e.preventDefault(); // Prevent browser menu activation
        altHeld = true;
    }
});

document.addEventListener("keyup", (e) => {
    if (!e.altKey) {
        e.preventDefault(); // Prevent browser menu activation
        altHeld = false;
    }
});

function getMousePos(e) {
    const r = canvas.getBoundingClientRect();
    return {
        x: e.touches ? e.touches[0].clientX - r.left : e.clientX - r.left,
        y: e.touches ? e.touches[0].clientY - r.top : e.clientY - r.top
    };
}

function startDrag(e) {
    const p = getMousePos(e);
    if (!showGrid) {
        showGrid = false;
    }
    selected = null;

    for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        let iw = it.w, ih = it.h;
        if (it.type === "text") {
            iw = ctx.measureText(it.text).width;
            ih = it.size * 8;
        }

        if (it.type === "line") {
            // Check line endpoints first
            const points = [
                { name: 'start', x: it.x - 5, y: it.y - 5 },
                { name: 'end', x: it.x2 - 5, y: it.y2 - 5 }
            ];
            
            for (let point of points) {
                if (p.x >= point.x && p.x <= point.x + 10 && p.y >= point.y && p.y <= point.y + 10) {
                    dragging = it;
                    resizing = true;
                    resizeHandle = point.name;
                    selected = it;
                    showGrid = true;
                    updateLayerSelect();
                    render();
                    return;
                }
            }
            
            // Check if clicking near the line itself
            const lineLength = Math.sqrt((it.x2 - it.x) ** 2 + (it.y2 - it.y) ** 2);
            if (lineLength > 0) {
                const tolerance = 5;
                const a = it.y2 - it.y;
                const b = it.x - it.x2;
                const c = it.x2 * it.y - it.x * it.y2;
                const distance = Math.abs(a * p.x + b * p.y + c) / Math.sqrt(a * a + b * b);
                
                if (distance <= tolerance) {
                    // Check if point is within line segment bounds
                    const minX = Math.min(it.x, it.x2) - tolerance;
                    const maxX = Math.max(it.x, it.x2) + tolerance;
                    const minY = Math.min(it.y, it.y2) - tolerance;
                    const maxY = Math.max(it.y, it.y2) + tolerance;
                    
                    if (p.x >= minX && p.x <= maxX && p.y >= minY && p.y <= maxY) {
                        dragging = it;
                        offsetX = p.x - it.x;
                        offsetY = p.y - it.y;
                        selected = it;
                        showGrid = true;
                        updateLayerSelect();
                        render();
                        return;
                    }
                }
            }
        } else {
            const corners = it.type !== "text" ? [
                { name: 'tl', x: it.x - 5, y: it.y - 5 },
                { name: 'tr', x: it.x + it.w - 5, y: it.y - 5 },
                { name: 'bl', x: it.x - 5, y: it.y + it.h - 5 },
                { name: 'br', x: it.x + it.w - 5, y: it.y + it.h - 5 }
            ] : [];

            for (let h of corners) {
                if (p.x >= h.x && p.x <= h.x + 10 && p.y >= h.y && p.y <= h.y + 10) {
                    dragging = it;
                    resizing = true;
                    resizeHandle = h.name;
                    selected = it;
                    showGrid = true;
                    updateLayerSelect();
                    render();
                    return;
                }
            }

            if (p.x >= it.x && p.x <= it.x + iw && p.y >= it.y && p.y <= it.y + ih) {
                dragging = it;
                offsetX = p.x - it.x;
                offsetY = p.y - it.y;
                selected = it;
                showGrid = true;
                updateLayerSelect();
                render();
                return;
            }
        }
    }
}

function drag(e) {
    if (!dragging) return;
    e.preventDefault();

    const p = getMousePos(e);

    if (resizing) {
        if (dragging.type === "line") {
            // Handle line point dragging
            if (resizeHandle === 'start') {
                dragging.x = (snapOn !== altHeld) ? Math.round(p.x / gridSize) * gridSize : p.x;
                dragging.y = (snapOn !== altHeld) ? Math.round(p.y / gridSize) * gridSize : p.y;
            } else if (resizeHandle === 'end') {
                dragging.x2 = (snapOn !== altHeld) ? Math.round(p.x / gridSize) * gridSize : p.x;
                dragging.y2 = (snapOn !== altHeld) ? Math.round(p.y / gridSize) * gridSize : p.y;
            }
        } else {
            // Handle other shapes resizing
            let nx = dragging.x,
                ny = dragging.y,
                nw = dragging.w,
                nh = dragging.h,
                mn = 5;

            if (resizeHandle.includes('t')) {
                ny = Math.min(p.y, dragging.y + dragging.h - mn);
                nh = dragging.h + (dragging.y - ny);
            }
            if (resizeHandle.includes('b')) nh = Math.max(mn, p.y - dragging.y);
            if (resizeHandle.includes('l')) {
                nx = Math.min(p.x, dragging.x + dragging.w - mn);
                nw = dragging.w + (dragging.x - nx);
            }
            if (resizeHandle.includes('r')) nw = Math.max(mn, p.x - dragging.x);

            nx = clamp(nx, 0, canvas.width - nw);
            ny = clamp(ny, 0, canvas.height - nh);
            nw = clamp(nw, mn, canvas.width - nx);
            nh = clamp(nh, mn, canvas.height - ny);

            if (snapOn !== altHeld) {
                dragging.x = Math.round(nx / gridSize) * gridSize;
                dragging.y = Math.round(ny / gridSize) * gridSize;
                dragging.w = Math.round(nw / gridSize) * gridSize;
                dragging.h = Math.round(nh / gridSize) * gridSize;
            } else {
                dragging.x = nx;
                dragging.y = ny;
                dragging.w = nw;
                dragging.h = nh;
            }
        }
    } else {
        // Handle moving entire shape
        if (dragging.type === "line") {
            let dx = p.x - dragging.x - offsetX;
            let dy = p.y - dragging.y - offsetY;
            
            if (snapOn !== altHeld) {
                dx = Math.round(dx / gridSize) * gridSize;
                dy = Math.round(dy / gridSize) * gridSize;
            }
            
            dragging.x += dx;
            dragging.y += dy;
            dragging.x2 += dx;
            dragging.y2 += dy;
        } else {
            let nx = p.x - offsetX;
            let ny = p.y - offsetY;

            if (snapOn !== altHeld) {
                nx = Math.round(nx / gridSize) * gridSize;
                ny = Math.round(ny / gridSize) * gridSize;
            }

            if (selected && selected.type === "text") {
                selected.x = clamp(nx, 0, canvas.width - selected.w);
                selected.y = clamp(ny, 0, canvas.height - selected.h);
            } else {
                dragging.x = clamp(nx, 0, canvas.width - dragging.w);
                dragging.y = clamp(ny, 0, canvas.height - dragging.h);
            }
        }
    }

    showGrid = true;
    render();
}

function stopDrag() {
    dragging = null;
    resizing = false;
    resizeHandle = null;
    // Keep grid visible if Always Show Grid is on
    if (!showGrid && alwaysShowGridInput.classList.contains('on')) {
        showGrid = true;
    } else if (!alwaysShowGridInput.classList.contains('on')) {
        showGrid = false;
    }
    render();
}


function updateLayerSelect() {
    shapeSelect.innerHTML = "";
    items.forEach((i, idx) => {
        let o = document.createElement("option");
        o.value = idx;
        o.text = `${i.type} ${idx + 1}`;
        if (i === selected) o.selected = true;
        shapeSelect.appendChild(o);
    });
}

shapeSelect.onchange = e => {
    selected = items[e.target.value];
    render();
};


function syncUI() {
    // Hide all dynamic controls first
    document.getElementById('textControl').style.display = 'none';
    document.getElementById('textSizeControl').style.display = 'none';
    document.getElementById('posXControl').style.display = 'none';
    document.getElementById('posYControl').style.display = 'none';
    document.getElementById('widthControl').style.display = 'none';
    document.getElementById('heightControl').style.display = 'none';
    document.getElementById('radiusControl').style.display = 'none';
    document.getElementById('x2Control').style.display = 'none';
    document.getElementById('y2Control').style.display = 'none';
    document.getElementById('colorControl').style.display = 'none';
    
    if (!selected) {
        // Show placeholder message when nothing is selected
        document.getElementById('noSelectionMessage').style.display = 'block';
        return;
    }
    
    // Hide placeholder message when something is selected
    document.getElementById('noSelectionMessage').style.display = 'none';
    
    // Always show position and color for all shapes
    document.getElementById('posXControl').style.display = 'flex';
    document.getElementById('posYControl').style.display = 'flex';
    document.getElementById('colorControl').style.display = 'flex';
    posXInput.value = Math.round(selected.x);
    posYInput.value = Math.round(selected.y);
    
    // Update common controls
    textInput.value = selected.text || '';
    colorInput.value = selected.color;
    
    // Show controls based on shape type
    switch(selected.type) {
        case 'fillRect':
        case 'rect':
            document.getElementById('widthControl').style.display = 'flex';
            document.getElementById('heightControl').style.display = 'flex';
            widthInput.value = Math.round(selected.w);
            heightInput.value = Math.round(selected.h);
            break;
            
        case 'circle':
        case 'fillCircle':
            document.getElementById('radiusControl').style.display = 'flex';
            radiusInput.value = Math.round(selected.w / 2);
            break;
            
        case 'line':
            document.getElementById('x2Control').style.display = 'flex';
            document.getElementById('y2Control').style.display = 'flex';
            x2Input.value = Math.round(selected.x2);
            y2Input.value = Math.round(selected.y2);
            break;
            
        case 'text':
            document.getElementById('textControl').style.display = 'flex';
            document.getElementById('textSizeControl').style.display = 'flex';
            textSizeInput.value = selected.size;
            break;
    }
}

textInput.addEventListener("input", () => {
    if (selected && selected.type === "text") {
        selected.text = textInput.value;
        render();
    }
});

colorInput.addEventListener("input", () => {
    if (selected) {
        selected.color = colorInput.value;
        render();
    }
});

textSizeInput.addEventListener("input", () => {
    if (selected && selected.type === "text") {
        selected.size = parseInt(textSizeInput.value);
        render();
    }
});

// Dynamic shape control event listeners
posXInput.addEventListener("input", () => {
    if (selected) {
        const newX = parseInt(posXInput.value);
        if (selected.type === 'line') {
            const dx = newX - selected.x;
            selected.x = newX;
            selected.x2 += dx;
            x2Input.value = Math.round(selected.x2);
        } else {
            selected.x = newX;
        }
        render();
    }
});

posYInput.addEventListener("input", () => {
    if (selected) {
        const newY = parseInt(posYInput.value);
        if (selected.type === 'line') {
            const dy = newY - selected.y;
            selected.y = newY;
            selected.y2 += dy;
            y2Input.value = Math.round(selected.y2);
        } else {
            selected.y = newY;
        }
        render();
    }
});

widthInput.addEventListener("input", () => {
    if (selected && (selected.type === 'fillRect' || selected.type === 'rect')) {
        selected.w = parseInt(widthInput.value);
        render();
    }
});

heightInput.addEventListener("input", () => {
    if (selected && (selected.type === 'fillRect' || selected.type === 'rect')) {
        selected.h = parseInt(heightInput.value);
        render();
    }
});

radiusInput.addEventListener("input", () => {
    if (selected && (selected.type === 'circle' || selected.type === 'fillCircle')) {
        const radius = parseInt(radiusInput.value);
        selected.w = radius * 2;
        selected.h = radius * 2;
        render();
    }
});

x2Input.addEventListener("input", () => {
    if (selected && selected.type === 'line') {
        selected.x2 = parseInt(x2Input.value);
        render();
    }
});

y2Input.addEventListener("input", () => {
    if (selected && selected.type === 'line') {
        selected.y2 = parseInt(y2Input.value);
        render();
    }
});


function rgb(h) {
    h = h.replace("#", "");
    return [
        parseInt(h.substr(0, 2), 16),
        parseInt(h.substr(2, 2), 16),
        parseInt(h.substr(4, 2), 16)
    ];
}

function saveState() {
    const state = {
        items: items,
        backgroundColor: backgroundColorInput.value,
        currentDevice: currentDevice,
        gridSize: gridSize,
        snapOn: snapOn,
        showGrid: showGrid,
        fileName: document.getElementById("fileName").value
    };
    localStorage.setItem('bruceJSDesignerState', JSON.stringify(state));
}

function loadState() {
    const savedState = localStorage.getItem('bruceJSDesignerState');
    if (savedState) {
        try {
            const state = JSON.parse(savedState);
            console.log('Loading saved state:', state);
            
            // Restore items
            items = state.items || [];
            
            // Restore background color
            if (state.backgroundColor) {
                backgroundColorInput.value = state.backgroundColor;
            }
            
            // Restore device selection
            if (state.currentDevice && devices[state.currentDevice]) {
                currentDevice = state.currentDevice;
                deviceSelect.value = state.currentDevice;
            }
            
            // Restore grid settings
            if (state.gridSize) {
                gridSize = state.gridSize;
                gridSizeInput.value = gridSize;
            }
            
            if (typeof state.snapOn === 'boolean') {
                snapOn = state.snapOn;
                snapToggle.textContent = snapOn ? "ON" : "OFF";
                snapToggle.classList.toggle("on", snapOn);
            }
            
            if (typeof state.showGrid === 'boolean') {
                showGrid = state.showGrid;
                alwaysShowGridInput.textContent = showGrid ? "ON" : "OFF";
                alwaysShowGridInput.classList.toggle("on", showGrid);
            }
            
            // Restore file name
            if (state.fileName) {
                document.getElementById("fileName").value = state.fileName;
            }
            
            // Update UI after loading state
            updateCanvasSize();
            updateLayerSelect();
            render();
            
            console.log('State loaded successfully');
            return true;
        } catch (e) {
            console.log('Failed to load saved state:', e);
        }
    }
    return false;
}


function generateCode() {
    const dev = devices[currentDevice];
    const W = dev[0], H = dev[1];

    let out = `// Device: ${currentDevice}
// Made with: Bruce JS designer

const keyboard = require('keyboard');
const display = require('display');

const sprite = display.createSprite();

while(true){

if(keyboard.getEscPress(true)) break;

sprite.fill(display.color(${rgb(backgroundColorInput.value).join(', ')}));
\n`;
 

    items.forEach(i => {
        const sx = W / canvas.width,
              sy = H / canvas.height;
        const x = Math.round(i.x * sx),
              y = Math.round(i.y * sy),
              w = Math.round(i.w * sx),
              h = Math.round(i.h * sy);
        const c = rgb(i.color).join(',');

        switch (i.type) {
            case "fillRect":
                out += `sprite.drawFillRect(${x}, ${y}, ${w}, ${h}, display.color(${c}));\n`;
                break;
            case "rect":
                out += `sprite.drawRect(${x}, ${y}, ${w}, ${h}, display.color(${c}));\n`;
                break;
            case "line":
                // Use actual line coordinates instead of bounding box
                const x1 = Math.round(i.x * sx);
                const y1 = Math.round(i.y * sy);
                const x2 = Math.round(i.x2 * sx);
                const y2 = Math.round(i.y2 * sy);
                out += `sprite.drawLine(${x1}, ${y1}, ${x2}, ${y2}, display.color(${c}));\n`;
                break;
            case "circle":
                out += `sprite.drawCircle(${x + Math.floor(w / 2)}, ${y + Math.floor(h / 2)}, ${Math.floor(w / 2)}, display.color(${c}));\n`;
                break;
            case "fillCircle":
                out += `sprite.drawFillCircle(${x + Math.floor(w / 2)}, ${y + Math.floor(h / 2)}, ${Math.floor(w / 2)}, display.color(${c}));\n`;
                break;
            case "text":
                out += `sprite.setTextSize(${i.size});
sprite.setTextColor(${c});
sprite.drawText("${i.text}", ${x}, ${y});\n`;
                break;
        }
    });

    out += `\nsprite.pushSprite();\n}`;
    code.textContent = out;
}
function exportJS() {
        const name = document.getElementById("fileName").value || "app";
        const blob = new Blob([code.textContent], { type: "text/javascript" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name + ".js";
        a.click();
    }

    deviceSelect.addEventListener("change", () => {
        currentDevice = deviceSelect.value;
        updateCanvasSize();
    });

    // Initialize the application
    populateDeviceDropdown();
    
    // Try to load saved state, if not found, use defaults
    if (!loadState()) {
        // No saved state, use defaults
        currentDevice = deviceSelect.value;
        updateCanvasSize();
        render();
        updateLayerSelect();
    }
</script>
